<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ÖPNV MV</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0d0d0f;
  --bg-card: #1c1c1e;
  --bg-elevated: #242426;
  --bg-hover: #2c2c2e;
  --text: #f5f5f7;
  --text-secondary: #98989d;
  --text-muted: #636366;
  --accent: #f5c000;
  --accent-dim: rgba(245,192,0,.12);
  --danger: #ff453a;
  --success: #30d158;
  --warning: #ff9f0a;
  --border: #38383a;
  --radius: 14px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --sidebar-w: 380px;

  --line-tram: #ee2e24;
  --line-bus: #7d3c98;
  --line-sbahn: #008542;
  --line-regional: #004db3;
  --line-ferry: #00a0e2;
  --line-ubahn: #0072c6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
input,button,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent-dim)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:600px}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Layout ── */
.app{display:flex;height:100vh;width:100vw}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg);display:flex;flex-direction:column;border-right:0.5px solid var(--border);z-index:10;position:relative}
.sidebar-header{padding:14px 16px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.sidebar-header .brand{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.sidebar-header .brand span{color:var(--accent)}
.sidebar-header .sub{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.sidebar-body{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}

/* ── Map Area ── */
.map-area{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
#map .leaflet-container{background:#1a1a2e;color:var(--text)}
.leaflet-popup-content-wrapper{background:var(--bg-card);color:var(--text);border-radius:var(--radius-sm)}
.leaflet-popup-tip{background:var(--bg-card)}

/* ── iOS-style Inputs ── */
.input-group{position:relative;margin-bottom:8px}
.input-group input{width:100%;padding:12px 14px;background:var(--bg-card);border:none;border-radius:var(--radius-sm);font-size:.9rem;color:var(--text);outline:none;transition:background .2s}
.input-group input:focus{background:var(--bg-elevated)}
.input-group input::placeholder{color:var(--text-muted)}
.input-group .label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px;display:block}

/* ── Suggestions ── */
.suggestions{position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--bg-elevated);border:0.5px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);max-height:180px;overflow-y:auto;display:none}
.suggestions.show{display:block;animation:fadeUp .12s ease}
.suggestions .suggestion{padding:10px 14px;cursor:pointer;font-size:.82rem;border-bottom:0.5px solid var(--border);transition:background .08s}
.suggestions .suggestion:last-child{border-bottom:none}
.suggestions .suggestion:hover{background:var(--bg-hover)}
.suggestions .suggestion .sub{font-size:.7rem;color:var(--text-secondary)}

/* ── Submit Button ── */
.btn-primary{width:100%;padding:13px;background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ── Trip Results in Sidebar ── */
.section-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin:18px 0 8px 2px}
.trip-result{background:var(--bg-card);border-radius:var(--radius);padding:14px;margin-bottom:8px;transition:all .2s;animation:fadeUp .25s ease}
.trip-result:hover{background:var(--bg-elevated)}
.trip-summary{display:flex;align-items:center;gap:14px;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border)}
.trip-summary .stat{text-align:center}
.trip-summary .stat .val{font-size:1rem;font-weight:700;color:var(--accent)}
.trip-summary .stat .lbl{font-size:.65rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.trip-leg{padding:6px 0;display:flex;align-items:flex-start;gap:10px;position:relative}
.trip-leg::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:1.5px;background:var(--border)}
.trip-leg:last-child::before{display:none}
.trip-leg .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;position:relative;z-index:1}
.trip-leg .dot.ride{background:var(--accent)}
.trip-leg .dot.footpath{background:var(--text-muted)}
.trip-leg .leg-info{flex:1;min-width:0}
.trip-leg .leg-info .leg-line{font-weight:600;font-size:.82rem}
.trip-leg .leg-info .leg-direction{font-size:.75rem;color:var(--text-secondary)}
.trip-leg .leg-info .leg-times{font-size:.7rem;color:var(--text-muted);margin-top:1px}
.trip-leg .leg-info .leg-stops{font-size:.7rem;color:var(--text-secondary);margin-top:1px}

/* Trip detail expandable */
.trip-detail{display:none;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.trip-detail.open{display:block;animation:fadeUp .2s ease}
.detail-stops{padding:0 2px;margin-bottom:14px}
.detail-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.detail-stop{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:.75rem;color:var(--text-secondary)}
.detail-stop .time{color:var(--text);font-weight:500;min-width:30px;font-size:.72rem}
.detail-stop .plat{color:var(--text-muted);font-size:.68rem}
.detail-stop .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ── Empty / Error state ── */
.empty-state{text-align:center;padding:40px 16px;color:var(--text-muted)}
.empty-state .icon{font-size:1.8rem;margin-bottom:8px;display:block}
.empty-state p{font-size:.82rem}
.error-state{text-align:center;padding:20px 16px}
.error-state .msg{color:var(--danger);font-size:.82rem;margin-bottom:10px}
.error-state button{background:var(--bg-card);border:none;padding:8px 20px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text);font-size:.82rem}
.error-state button:hover{background:var(--bg-hover)}

/* ── Loading ── */
.loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(13,13,15,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .25s}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* ── Sheet handle (mobile) ── */
.sheet-handle{display:none}

@media(max-width:720px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;z-index:100;width:100%;min-width:100%;height:auto;max-height:88vh;border-radius:16px 16px 0 0;border-right:none;border-top:0.5px solid var(--border);transform:translateY(calc(100% - 46px));transition:transform .4s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
  .sidebar.open{transform:translateY(0)}
  .sidebar.closed .sidebar-body{overflow:hidden;max-height:0;padding:0 16px}
  .sidebar .sidebar-body{transition:max-height .3s ease,padding .3s ease}
  .sheet-handle{display:flex;align-items:center;justify-content:center;height:40px;cursor:pointer;flex-shrink:0;position:relative;border-radius:16px 16px 0 0;background:var(--bg)}
  .sheet-handle .bar{width:36px;height:4.5px;border-radius:3px;background:var(--text-muted);transition:background .2s}
  .sheet-handle:active .bar{background:var(--text-secondary)}
  .sidebar-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99}
  .sidebar-backdrop.show{display:block}
  .map-area{position:fixed;top:0;left:0;right:0;bottom:0}
  #map{width:100%;height:100%}
}
</style>
</head>
<body>

<div class="app">

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Sidebar / Bottom Sheet -->
  <aside class="sidebar" id="sidebar">
    <div class="sheet-handle" id="sheet-handle"><div class="bar"></div></div>
    <div class="sidebar-header">
      <div class="brand">ÖPNV<span>MV</span></div>
      <div class="sub">Mecklenburg-Vorpommern</div>
    </div>
    <div class="sidebar-body" id="sidebar-body">

      <!-- Trip Form -->
      <form id="trip-form">
        <div class="input-group">
          <span class="label">Von</span>
          <input type="text" id="trip-origin" placeholder="Haltestelle, Adresse oder Ort…" autocomplete="off">
          <div class="suggestions" id="origin-suggestions"></div>
        </div>
        <div class="input-group">
          <span class="label">Nach</span>
          <input type="text" id="trip-destination" placeholder="Haltestelle, Adresse oder Ort…" autocomplete="off">
          <div class="suggestions" id="destination-suggestions"></div>
        </div>
        <div style="display:flex;gap:8px">
          <div class="input-group" style="flex:1">
            <input type="date" id="trip-date">
          </div>
          <div class="input-group" style="flex:1">
            <input type="time" id="trip-time" value="12:00">
          </div>
        </div>
        <button type="submit" class="btn-primary" id="trip-submit">Verbindung suchen</button>
      </form>

      <!-- Trip Results -->
      <div id="trip-results"></div>

      <!-- Search History -->
      <div id="history-section" style="margin-top:4px">
        <div class="section-label" style="margin-top:12px">Verlauf</div>
        <div id="history-list"></div>
      </div>

    </div>
  </aside>

  <!-- Map -->
  <div class="map-area">
    <div id="map"></div>
  </div>

</div>

<div id="loading" class="loading hidden"><div class="spinner"></div></div>

<script>
const state = {
  origin: null,
  destination: null,
  stopMarkers: [],
  tripRoute: null,
  originMarker: null,
  destMarker: null,
  map: null
};

function showLoading() { document.getElementById('loading').classList.remove('hidden') }
function hideLoading() { document.getElementById('loading').classList.add('hidden') }

function normalizeEfaDate(s) {
  if (!s || !/^\d{2}-\d{2}-\d{4}/.test(s)) return s;
  const [d, m, y] = s.split('T')[0].split('-');
  return `${y}-${m}-${d}T${s.split('T')[1] || ''}`;
}

function formatTime(isoStr) {
  if (!isoStr) return null;
  try { const d = new Date(normalizeEfaDate(isoStr)); if (isNaN(d.getTime())) return null; return d.toTimeString().slice(0, 5) } catch { return null }
}

function parseDelay(planned, realtime) {
  if (!planned || !realtime) return { text: '–', cls: 'on-time' };
  const np = normalizeEfaDate(planned);
  const nr = normalizeEfaDate(realtime);
  const p = np.split('T')[1]?.split(':').slice(0,2).join(':');
  const r = nr.split('T')[1]?.split(':').slice(0,2).join(':');
  if (!p || !r) return { text: '–', cls: 'on-time' };
  const pMin = parseInt(p.split(':')[0],10)*60 + parseInt(p.split(':')[1],10);
  const rMin = parseInt(r.split(':')[0],10)*60 + parseInt(r.split(':')[1],10);
  const diff = rMin - pMin;
  if (diff <= 0) return { text: 'pünktlich', cls: 'on-time' };
  if (diff <= 5) return { text: `+${diff}`, cls: 'late' };
  return { text: `+${diff}`, cls: 'very-late' };
}

const LINE_PALETTES = {
  bus: ['#f5c000', '#ff9f0a', '#e67e22', '#d4a017', '#f0b400'],
  strassenbahn: ['#ee2e24', '#e94560', '#ff453a', '#c0392b', '#d63031'],
  sbahn: ['#008542', '#2ea043', '#30d158', '#00b894', '#00cec9'],
  regional: ['#004db3', '#3498db', '#00b4d8', '#0984e3', '#6c5ce7'],
  ferry: ['#00a0e2', '#00cec9', '#00b894', '#0984e3', '#1abc9c'],
  default: ['#636366', '#98989d', '#48484a', '#636366', '#98989d']
};

function getLineColor(transportType, lineName) {
  const t = (transportType || '').toLowerCase();
  let palette;
  if (t.includes('bus')) palette = LINE_PALETTES.bus;
  else if (t.includes('stra\u00dfenbahn') || t.includes('tram')) palette = LINE_PALETTES.strassenbahn;
  else if (t.includes('s-bahn') && !t.includes('u-bahn')) palette = LINE_PALETTES.sbahn;
  else if (t.includes('regional') || t.includes('re ') || t.includes('rb ')) palette = LINE_PALETTES.regional;
  else if (t.includes('fähre') || t.includes('faehre') || t.includes('ferry')) palette = LINE_PALETTES.ferry;
  else palette = LINE_PALETTES.default;
  const num = parseInt(lineName, 10) || lineName?.length || 0;
  return palette[num % palette.length];
}

async function api(method, url, body) {
  const base = window.API_BASE_URL || '';
  const fullUrl = base + url;
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body) }
  const res = await fetch(fullUrl, opts);
  if (!res.ok) { let msg = `HTTP ${res.status}`; try { const j = await res.json(); msg = j.message || j.error || msg } catch {} throw new Error(msg) }
  return res.json();
}

// ── Map Init ──
function initMap() {
  const map = L.map('map', { zoomControl: false }).setView([54.08, 12.13], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap-Mitwirkende', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);
  state.map = map;
  return map;
}

function clearMapOverlays() {
  state.stopMarkers.forEach(m => m.remove());
  state.stopMarkers = [];
  if (state.originMarker) { state.originMarker.remove(); state.originMarker = null }
  if (state.destMarker) { state.destMarker.remove(); state.destMarker = null }
  if (state.tripRoute) { state.tripRoute.forEach(l => l.remove()); state.tripRoute = null }
}

// ── Sheet Drag (mobile) ──
const sidebar = document.getElementById('sidebar');
const sheetHandle = document.getElementById('sheet-handle');
const backdrop = document.getElementById('sidebar-backdrop');
let dragState = null;

function getSheetHeight() { return sidebar.scrollHeight; }

function openSheet() {
  sidebar.classList.add('open');
  sidebar.classList.remove('closed');
  sidebar.style.transform = '';
  backdrop.classList.add('show');
}

function closeSheet() {
  sidebar.classList.remove('open');
  sidebar.classList.add('closed');
  sidebar.style.transform = '';
  backdrop.classList.remove('show');
}

function toggleSheet() {
  if (sidebar.classList.contains('open')) closeSheet();
  else openSheet();
}

function onDragStart(y) {
  if (window.innerWidth > 720) return;
  const rect = sidebar.getBoundingClientRect();
  dragState = { startY: y, startTranslate: window.innerHeight - rect.top, moved: false };
}

function onDragMove(y) {
  if (!dragState) return;
  const dy = y - dragState.startY;
  const visible = Math.max(46, Math.min(dragState.startTranslate - dy, window.innerHeight - 60));
  sidebar.style.transform = `translateY(${Math.max(0, sidebar.scrollHeight - visible)}px)`;
  if (Math.abs(dy) > 5) dragState.moved = true;
}

function onDragEnd(y) {
  if (!dragState) return;
  const dy = y ? y - dragState.startY : 0;
  const isOpen = sidebar.classList.contains('open');
  // Toggle if dragged more than 30% of sheet height or velocity > threshold
  const sheetH = getSheetHeight();
  if (dragState.moved && Math.abs(dy) > sheetH * 0.3) {
    if (dy < 0) openSheet();
    else closeSheet();
  } else if (dragState.moved && Math.abs(dy) > 20) {
    if (isOpen && dy > 20) closeSheet();
    else if (!isOpen && dy < -20) openSheet();
    else toggleSheet();
  } else {
    // Treat as tap
    toggleSheet();
  }
  dragState = null;
}

// Touch events
sheetHandle.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
sheetHandle.addEventListener('touchmove', e => onDragMove(e.touches[0].clientY), { passive: true });
sheetHandle.addEventListener('touchend', e => {
  const y = e.changedTouches?.[0]?.clientY;
  onDragEnd(y);
}, { passive: true });

// Mouse events for desktop testing / dev tools mobile mode
sheetHandle.addEventListener('mousedown', e => { e.preventDefault(); onDragStart(e.clientY) });
document.addEventListener('mousemove', e => { if (dragState) { e.preventDefault(); onDragMove(e.clientY) } });
document.addEventListener('mouseup', e => { if (dragState) { onDragEnd(e.clientY) } });

backdrop.addEventListener('click', closeSheet);

// ── Trip Autocomplete ──
const tripOrigin = document.getElementById('trip-origin');
const tripDest = document.getElementById('trip-destination');
const originSuggestions = document.getElementById('origin-suggestions');
const destSuggestions = document.getElementById('destination-suggestions');
const tripForm = document.getElementById('trip-form');
const tripResults = document.getElementById('trip-results');

let originDebounce = null, destDebounce = null;

function setupAutocomplete(input, suggestionsEl, key) {
  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(input === tripOrigin ? originDebounce : destDebounce);
    if (q.length < 2) { suggestionsEl.classList.remove('show'); suggestionsEl.innerHTML = ''; return }
    const debounce = setTimeout(async () => {
      try {
        const data = await api('GET', `/api/stops?q=${encodeURIComponent(q)}`);
        if (!data || data.length === 0) {
          suggestionsEl.innerHTML = '<div class="suggestion" style="color:var(--text-muted);cursor:default">Keine Ergebnisse</div>';
        } else {
          suggestionsEl.innerHTML = data.map(s => {
            const typeBadge = s.type === 'address' ? '<span style="font-size:.65rem;color:var(--text-muted)">Adresse</span>' :
                             s.type === 'poi' ? '<span style="font-size:.65rem;color:var(--text-muted)">POI</span>' :
                             '<span style="font-size:.65rem;color:var(--accent)">Haltestelle</span>';
            return `<div class="suggestion" data-id="${s.id}" data-name="${s.name}" data-lat="${s.lat||''}" data-lon="${s.lon||''}" data-type="${s.type||'stop'}" data-stateless="${s.stateless||''}" data-efatype="${s.efaType||s.type||'stop'}">
              ${s.name}
              <div class="sub">${typeBadge} ${s.place || ''}</div>
            </div>`;
          }).join('');

          suggestionsEl.querySelectorAll('.suggestion').forEach(el => {
            el.addEventListener('click', () => {
              const type = el.dataset.type || 'stop';
              const stateless = el.dataset.stateless || '';
              state[key] = { id: el.dataset.id, name: el.dataset.name, lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon), type, stateless, efaType: el.dataset.efatype || type };
              input.value = el.dataset.name;
              suggestionsEl.classList.remove('show');
              suggestionsEl.innerHTML = '';
              addStopMarker(state[key]);
              if (key === 'origin') document.getElementById('trip-destination').focus();
            });
          });
        }
        suggestionsEl.classList.add('show');
      } catch { suggestionsEl.classList.remove('show') }
    }, 300);
    if (input === tripOrigin) originDebounce = debounce; else destDebounce = debounce;
  });
  input.addEventListener('blur', () => setTimeout(() => { suggestionsEl.classList.remove('show') }, 200));
  input.addEventListener('focus', () => { if (suggestionsEl.children.length > 0) suggestionsEl.classList.add('show') });
}

setupAutocomplete(tripOrigin, originSuggestions, 'origin');
setupAutocomplete(tripDest, destSuggestions, 'destination');

function addStopMarker(stop) {
  if (!stop || !isFinite(stop.lat) || !isFinite(stop.lon) || !state.map) return;
  if (stop.lat < -90 || stop.lat > 90 || stop.lon < -180 || stop.lon > 180) return;
  if (stop.type === 'address') {
    const icon = L.divIcon({
      className: '', html: `<div style="background:var(--accent);width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0d0d0f;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff">⌂</div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
    const marker = L.marker([stop.lat, stop.lon], { icon }).addTo(state.map).bindPopup(`<b>${stop.name}</b><br>Adresse`);
    if (stop === state.origin) state.originMarker = marker;
    if (stop === state.destination) state.destMarker = marker;
    state.map.setView([stop.lat, stop.lon], state.map.getZoom() < 14 ? 14 : state.map.getZoom());
  } else {
    const marker = L.circleMarker([stop.lat, stop.lon], {
      radius: 10, color: stop === state.origin ? '#30d158' : stop === state.destination ? '#ff453a' : '#f5c000',
      fillColor: '#fff', fillOpacity: 1, weight: 3
    }).addTo(state.map).bindPopup(`<b>${stop.name}</b>`);
    state.map.setView([stop.lat, stop.lon], state.map.getZoom() < 14 ? 14 : state.map.getZoom());
  }
}

// ── Set default date ──
const today = new Date();
document.getElementById('trip-date').value = today.toISOString().slice(0, 10);

// ── Trip Submit ──
tripForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const origin = state.origin;
  const destination = state.destination;
  if (!origin || !destination) {
    tripResults.innerHTML = '<div class="error-state"><div class="msg">Bitte wähle Start- und Ziel aus den Vorschlägen aus</div></div>';
    return;
  }
  const dateInput = document.getElementById('trip-date').value;
  const timeInput = document.getElementById('trip-time').value;
  const date = dateInput ? dateInput.split('-').reverse().join('.') : '';
  const time = timeInput || '12:00';
  const originId = origin.type === 'address' ? origin.name : origin.id;
  const destId = destination.type === 'address' ? destination.name : destination.id;
  const originType = origin.type === 'address' ? (origin.efaType || 'address') : 'stop';
  const destType = destination.type === 'address' ? (destination.efaType || 'address') : 'stop';
  showLoading();
  try {
    const data = await api('POST', '/api/trip', { origin: originId, destination: destId, originType, destinationType: destType, time, date });
    addToHistory(origin, destination);
    renderTrip(data);
  } catch (e) {
    tripResults.innerHTML = `<div class="error-state"><div class="msg">Fehler: ${e.message}</div></div>`;
  } finally {
    hideLoading();
  }
});

// ── Render Trip ──
function renderTrip(data) {
  if (!data || !data.legs || data.legs.length === 0) {
    tripResults.innerHTML = '<div class="empty-state"><span class="icon">🔄</span><p>Keine Verbindung gefunden</p></div>';
    return;
  }
  const tripId = Date.now();
  const legData = [];

  // Prepend/append walking legs for resolved addresses
  const allLegs = [...data.legs];
  if (data.addrOrigin) {
    allLegs.unshift({
      type: 'footpath',
      origin: { name: data.addrOrigin.name, id: data.addrOrigin.id, lat: data.addrOrigin.lat, lon: data.addrOrigin.lon, plannedTime: null, realtimeTime: null, platform: '' },
      destination: allLegs[0]?.type === 'footpath' ? allLegs[0].origin : (allLegs[0]?.origin || { name: '', id: '', lat: 0, lon: 0, plannedTime: null, realtimeTime: null, platform: '' })
    });
  }
  if (data.addrDest) {
    const lastLeg = allLegs[allLegs.length - 1];
    if (lastLeg && lastLeg.type === 'footpath' && lastLeg.destination) {
      allLegs.push({
        type: 'footpath',
        origin: lastLeg.destination,
        destination: { name: data.addrDest.name, id: data.addrDest.id, lat: data.addrDest.lat, lon: data.addrDest.lon, plannedTime: null, realtimeTime: null, platform: '' }
      });
    } else {
      allLegs.push({
        type: 'footpath',
        origin: lastLeg ? lastLeg.destination : { name: '', id: '', lat: 0, lon: 0, plannedTime: null, realtimeTime: null, platform: '' },
        destination: { name: data.addrDest.name, id: data.addrDest.id, lat: data.addrDest.lat, lon: data.addrDest.lon, plannedTime: null, realtimeTime: null, platform: '' }
      });
    }
  }

  let html = `<div class="section-label">Verbindung · ${data.duration} Min · ${data.transfers} Umstieg${data.transfers !== 1 ? 'e' : ''}</div>`;
  html += `<div class="trip-result" onclick="toggleDetail(${tripId})" id="trip-${tripId}">`;

  allLegs.forEach((leg, i) => {
    if (leg.type === 'ride') {
      const lineColor = getLineColor(leg.line?.transportType, leg.line?.name);
      const depTime = formatTime(leg.origin?.realtimeTime) || formatTime(leg.origin?.plannedTime) || '';
      const arrTime = formatTime(leg.destination?.realtimeTime) || formatTime(leg.destination?.plannedTime) || '';
      const depPlat = leg.origin?.platform ? `Steig ${leg.origin.platform}` : '';
      const arrPlat = leg.destination?.platform ? `Steig ${leg.destination.platform}` : '';
      const stopsCount = leg.intermediateStops?.length || 0;
      const waypoints = [], stopMarkers = [];
      if (leg.origin?.lon && leg.origin?.lat) {
        waypoints.push([leg.origin.lon, leg.origin.lat]);
        stopMarkers.push({ lat: leg.origin.lat, lon: leg.origin.lon, label: leg.origin.name, type: 'origin', time: formatTime(leg.origin?.realtimeTime) || formatTime(leg.origin?.plannedTime) || '' });
      }
      const allStops = leg.allStops || [];
      const oId = leg.origin?.id, dId = leg.destination?.id;
      let midStops = [];
      if (allStops.length && oId && dId) {
        const oIdx = allStops.findIndex(s => s.id === oId);
        const dIdx = allStops.findIndex(s => s.id === dId);
        if (oIdx !== -1 && dIdx !== -1) midStops = oIdx < dIdx ? allStops.slice(oIdx+1, dIdx) : allStops.slice(dIdx+1, oIdx).reverse();
      }
      if (!midStops.length) midStops = leg.intermediateStops || [];
      midStops.forEach(s => { if (s.lon && s.lat) { waypoints.push([s.lon, s.lat]); stopMarkers.push({ lat: s.lat, lon: s.lon, label: s.name, type: 'stop', time: formatTime(s.realtimeTime)||formatTime(s.plannedTime)||'' }) } });
      if (leg.destination?.lon && leg.destination?.lat) {
        waypoints.push([leg.destination.lon, leg.destination.lat]);
        stopMarkers.push({ lat: leg.destination.lat, lon: leg.destination.lon, label: leg.destination.name, type: 'destination', time: formatTime(leg.destination?.realtimeTime) || formatTime(leg.destination?.plannedTime) || '' });
      }
      legData.push({ coords: waypoints, stopMarkers, name: leg.line?.name || '?', color: lineColor });

      const delayInfo = (() => {
        const d = parseDelay(leg.origin?.plannedTime, leg.origin?.realtimeTime);
        const delayClass = d.cls === 'very-late' ? 'var(--danger)' : d.cls === 'late' ? 'var(--warning)' : 'var(--success)';
        return d.text !== '–' ? `<span style="font-size:.7rem;color:${delayClass};font-weight:600">${d.text}</span>` : '';
      })();
      html += `<div class="trip-leg">
        <div class="dot ride" style="background:${lineColor}"></div>
        <div class="leg-info">
          <div class="leg-line" style="color:${lineColor}">${leg.line?.name || '?'} · ${leg.line?.transportType || ''}</div>
          <div class="leg-direction">Richtung ${leg.line?.direction || ''}</div>
          <div class="leg-times">${depTime} ${leg.origin?.name || ''}${depPlat ? ' ('+depPlat+')' : ''} → ${arrTime} ${leg.destination?.name || ''}${arrPlat ? ' ('+arrPlat+')' : ''}</div>
          ${delayInfo ? `<div style="margin-top:2px">${delayInfo}</div>` : ''}
          ${stopsCount > 0 ? `<div class="leg-stops">${stopsCount} Zwischenhalt${stopsCount!==1 ? 'e' : ''}</div>` : ''}
        </div>
      </div>`;
    } else {
      const depTime = formatTime(leg.origin?.plannedTime) || '';
      const arrTime = formatTime(leg.destination?.plannedTime) || '';
      const walkingMin = leg.walkingDuration ? Math.round(leg.walkingDuration / 60) : 0;
      const lc = [];
      if (leg.origin?.lon && leg.origin?.lat) lc.push([leg.origin.lon, leg.origin.lat]);
      if (leg.destination?.lon && leg.destination?.lat) lc.push([leg.destination.lon, leg.destination.lat]);
      legData.push({ coords: lc, stopMarkers: [], name: 'Fußweg' });
      html += `<div class="trip-leg" style="opacity:.5">
        <div class="dot footpath"></div>
        <div class="leg-info">
          <div class="leg-line">Fußweg ${walkingMin ? `· ${walkingMin} Min` : ''}</div>
          <div class="leg-times">${depTime} ${leg.origin?.name || ''} → ${arrTime} ${leg.destination?.name || ''}</div>
        </div>
      </div>`;
    }
  });

  // Detail
  html += `<div class="trip-detail" id="detail-${tripId}">`;
  allLegs.forEach((leg, i) => {
    if (leg.type === 'ride') {
      const lineColor = getLineColor(leg.line?.transportType, leg.line?.name);
      const allStops = leg.allStops || [];
      const oId = leg.origin?.id, dId = leg.destination?.id;
      let midStops = [];
      if (allStops.length && oId && dId) {
        const oIdx = allStops.findIndex(s => s.id === oId);
        const dIdx = allStops.findIndex(s => s.id === dId);
        if (oIdx !== -1 && dIdx !== -1) midStops = oIdx < dIdx ? allStops.slice(oIdx+1, dIdx) : allStops.slice(dIdx+1, oIdx).reverse();
      }
      html += `<div class="detail-stops" style="border-left:3px solid ${lineColor};padding-left:12px;margin-bottom:14px">`;
      html += `<div class="detail-label"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${lineColor};margin-right:6px"></span>${leg.line?.name||'?'} · ${leg.line?.transportType||''} → ${leg.line?.direction||''}</div>`;
      const ot = formatTime(leg.origin?.realtimeTime) || formatTime(leg.origin?.plannedTime) || '';
      html += `<div class="detail-stop"><div class="dot" style="background:#30d158"></div><span class="time">${ot}</span><strong>${leg.origin?.name||''}</strong>${leg.origin?.platform ? ' · Steig '+leg.origin.platform : ''}</div>`;
      midStops.forEach(s => { const t = formatTime(s.realtimeTime)||formatTime(s.plannedTime)||''; html += `<div class="detail-stop"><div class="dot" style="background:${lineColor}"></div><span class="time">${t}</span>${s.name}</div>`; });
      const at = formatTime(leg.destination?.realtimeTime) || formatTime(leg.destination?.plannedTime) || '';
      html += `<div class="detail-stop"><div class="dot" style="background:#ff453a"></div><span class="time">${at}</span><strong>${leg.destination?.name||''}</strong>${leg.destination?.platform ? ' · Steig '+leg.destination.platform : ''}</div>`;
      html += '</div>';
    }
  });
  html += `</div></div>`;

  tripResults.innerHTML = html;
  drawTripOnMap(legData);
  // Close mobile sidebar after search
  if (window.innerWidth <= 720) closeSheet()
  // Scroll to results
  document.getElementById('trip-results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleDetail(id) {
  const detail = document.getElementById(`detail-${id}`);
  if (detail) detail.classList.toggle('open');
}

async function drawTripOnMap(legData) {
  if (!state.map) return;
  clearMapOverlays();
  const map = state.map;
  const allLatLngs = [];
  const routeLayers = [];

  legData.forEach((leg, idx) => {
    let latlngs = leg.coords
      .map(c => [c[1], c[0]])
      .filter(c => isFinite(c[0]) && isFinite(c[1]) && c[0] >= -90 && c[0] <= 90 && c[1] >= -180 && c[1] <= 180);
    // Skip outlier stops >3° from the leg's median (bad EFA coordinates).
    // For exactly 2 points, check if they're implausibly far apart (>5°).
    if (latlngs.length === 2) {
      const dLat = Math.abs(latlngs[0][0] - latlngs[1][0]);
      const dLng = Math.abs(latlngs[0][1] - latlngs[1][1]);
      if (dLat > 5 || dLng > 5) return;
    } else if (latlngs.length > 2) {
      const lats = latlngs.map(c => c[0]).sort((a,b) => a-b);
      const lngs = latlngs.map(c => c[1]).sort((a,b) => a-b);
      const mLat = lats[Math.floor(lats.length/2)], mLng = lngs[Math.floor(lngs.length/2)];
      const cleaned = latlngs.filter(c => Math.abs(c[0] - mLat) < 3 && Math.abs(c[1] - mLng) < 3);
      if (cleaned.length >= 2) latlngs = cleaned;
    }
    if (latlngs.length < 2) return;
    allLatLngs.push(...latlngs);

    const isRide = leg.name !== 'Fußweg';
    const color = leg.color || '#f5c000';
    const opts = isRide
      ? { color, weight: 5, opacity: 0.9 }
      : { color: '#888', weight: 2, opacity: 0.4, dashArray: '6,6' };
    const polyline = L.polyline(latlngs, opts).addTo(map);
    routeLayers.push(polyline);

    // Stop markers – skip outliers >3° from median
    if (leg.stopMarkers?.length) {
      const smLats = leg.stopMarkers.map(s => s.lat).sort((a,b) => a-b);
      const smLngs = leg.stopMarkers.map(s => s.lon).sort((a,b) => a-b);
      const smMedLat = smLats[Math.floor(smLats.length/2)];
      const smMedLng = smLngs[Math.floor(smLngs.length/2)];
      leg.stopMarkers.forEach((sm, si) => {
        if (!isFinite(sm.lat) || !isFinite(sm.lon) || sm.lat < -90 || sm.lat > 90 || sm.lon < -180 || sm.lon > 180) return;
        if (leg.stopMarkers.length > 2 && (Math.abs(sm.lat - smMedLat) > 3 || Math.abs(sm.lon - smMedLng) > 3)) return;
        const isStart = idx === 0 && si === 0;
        const isEnd = idx === legData.length - 1 && si === leg.stopMarkers.length - 1;

        if (isStart || isEnd) {
          const marker = L.marker([sm.lat, sm.lon]).addTo(map);
          marker.bindPopup(`<b>${isStart ? 'Start' : 'Ziel'}</b><br>${sm.label}${sm.time ? '<br>' + sm.time : ''}`);
          routeLayers.push(marker);
          if (isStart) state.originMarker = marker;
          if (isEnd) state.destMarker = marker;
        } else {
          const circle = L.circleMarker([sm.lat, sm.lon], {
            radius: 6, color, fillColor: '#fff', fillOpacity: 1, weight: 2.5
          }).addTo(map);
          circle.bindPopup(`${sm.label}${sm.time ? '<br>' + sm.time : ''}`);
          routeLayers.push(circle);
        }
      });
    }
  });

  state.tripRoute = routeLayers;

  // Remove outlier coordinates (e.g. stops with wrong EFA data far from route)
  if (allLatLngs.length > 2) {
    const lats = allLatLngs.map(c => c[0]).sort((a,b) => a-b);
    const lngs = allLatLngs.map(c => c[1]).sort((a,b) => a-b);
    const medLat = lats[Math.floor(lats.length/2)];
    const medLng = lngs[Math.floor(lngs.length/2)];
    const filtered = allLatLngs.filter(c => Math.abs(c[0] - medLat) < 5 && Math.abs(c[1] - medLng) < 5);
    if (filtered.length >= 2) { allLatLngs.length = 0; allLatLngs.push(...filtered); }
  }

  if (allLatLngs.length > 1) {
    try {
      map.fitBounds(allLatLngs, { padding: [50, 50] });
    } catch {
      // fallback: keep current view
    }
  }
}

// ── Search History ──
function getHistory() {
  try { return JSON.parse(localStorage.getItem('routeHistory') || '[]') } catch { return [] }
}

function addToHistory(origin, destination) {
  let h = getHistory();
  const originHistoryId = origin.type === 'address' ? origin.name : origin.id;
  const destHistoryId = destination.type === 'address' ? destination.name : destination.id;
  h = h.filter(e => !(e.origin.id === originHistoryId && e.dest.id === destHistoryId));
  h.unshift({ origin: { id: originHistoryId, name: origin.name, type: origin.type || 'stop', stateless: origin.stateless || '', efaType: origin.efaType || '' }, dest: { id: destHistoryId, name: destination.name, type: destination.type || 'stop', stateless: destination.stateless || '', efaType: destination.efaType || '' }, time: Date.now() });
  if (h.length > 20) h = h.slice(0, 20);
  localStorage.setItem('routeHistory', JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  const h = getHistory();
  if (!h.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:.8rem;padding:16px 4px">Noch keine Routen gesucht</div>';
    return;
  }
  el.innerHTML = h.map(e => {
    const originLabel = e.origin.type === 'address' ? 'Adresse' : e.origin.type === 'poi' ? 'POI' : 'Haltestelle';
    const destLabel = e.dest.type === 'address' ? 'Adresse' : e.dest.type === 'poi' ? 'POI' : 'Haltestelle';
    return `<div class="suggestion" style="cursor:pointer;padding:10px 12px;border-radius:8px;margin-bottom:2px;transition:background .1s;font-size:.82rem"
          onclick="searchHistory('${e.origin.id.replace(/'/g,"\\'")}','${e.origin.name.replace(/'/g,"\\'")}','${e.dest.id.replace(/'/g,"\\'")}','${e.dest.name.replace(/'/g,"\\'")}','${e.origin.type||'stop'}','${e.dest.type||'stop'}','${(e.origin.stateless||'').replace(/'/g,"\\'")}','${(e.dest.stateless||'').replace(/'/g,"\\'")}','${(e.origin.efaType||'').replace(/'/g,"\\'")}','${(e.dest.efaType||'').replace(/'/g,"\\'")}')"
          onmouseover="this.style.background='var(--bg-hover)'"
          onmouseout="this.style.background=''">
      <span style="color:var(--accent);font-weight:600">${e.origin.name}</span> <span style="color:var(--text-muted)">→</span> <span style="color:var(--text)">${e.dest.name}</span>
      <div class="sub" style="font-size:.7rem;color:var(--text-muted);margin-top:1px">${originLabel} → ${destLabel}</div>
    </div>`;
  }).join('');
}

function searchHistory(originId, originName, destId, destName, originType, destType, originStateless, destStateless, originEfaType, destEfaType) {
  state.origin = { id: originId, name: originName, type: originType || 'stop', stateless: originStateless || '', efaType: originEfaType || '' };
  state.destination = { id: destId, name: destName, type: destType || 'stop', stateless: destStateless || '', efaType: destEfaType || '' };
  tripOrigin.value = originName;
  tripDest.value = destName;
  if (window.innerWidth <= 720) closeSheet()
  document.getElementById('trip-submit').click();
}

// ── Load stops on map (initial + search) ──
async function loadStopsOnMap(query) {
  try {
    const data = await api('GET', `/api/stops?q=${encodeURIComponent(query)}`);
    if (!data || data.length === 0 || !state.map) return;
    state.stopMarkers.forEach(m => m.remove());
    state.stopMarkers = [];
    const markers = [];
    data.forEach(s => {
      if (!isFinite(s.lat) || !isFinite(s.lon) || s.lat < -90 || s.lat > 90 || s.lon < -180 || s.lon > 180) return;
      const m = L.circleMarker([s.lat, s.lon], {
        radius: 7, color: '#f5c000', fillColor: '#f5c000', fillOpacity: 0.35, weight: 2
      }).addTo(state.map);
      m.bindPopup(`<b>${s.name}</b><br>${s.place || ''} ${s.gid || ''}`);
      markers.push(m);
    });
    state.stopMarkers = markers;
    if (markers.length > 0) {
      const group = L.featureGroup(markers);
      state.map.fitBounds(group.getBounds().pad(0.1));
    }
  } catch {}
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  renderHistory();
  loadStopsOnMap('Schwerin');
  if (window.innerWidth <= 720) closeSheet();
  tripOrigin.focus();
});
</script>
